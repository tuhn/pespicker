<script>
// PWA links only when served over http(s): from file:// they would just be failed requests.
if (/^https?:$/.test(location.protocol)) {
  for (const [rel, href] of [['manifest', 'manifest.webmanifest'], ['apple-touch-icon', 'icons/apple-touch-icon.png']]) {
    const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l);
  }
}
</script>
